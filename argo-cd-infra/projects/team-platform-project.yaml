apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: argocd-team-platform
  namespace: argocd
spec:
  description: Project for team-platform namespace Applications and ApplicationSets

  sourceNamespaces:
    - argocd-team-platform

  destinations:
    - namespace: 'argocd-team-*'
      server: https://kubernetes.default.svc
    - namespace: 'argocd-infra-*'
      server: https://kubernetes.default.svc

  sourceRepos:
    - https://github.com/argoproj/argocd-example-apps

  clusterResourceWhitelist:
    - group: ''
      kind: Namespace